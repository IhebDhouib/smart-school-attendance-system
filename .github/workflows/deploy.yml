# =============================================================================
# GitHub Actions CI/CD Pipeline for Madrasati
# =============================================================================
# This workflow automatically deploys to production on push to main branch
# =============================================================================

name: Deploy Madrasati to Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allow manual trigger

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: ihebdhouib/madrasati

jobs:
  # ===========================================================================
  # Job 1: Build and Test
  # ===========================================================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "madrasati/madrasati/backend/package-lock.json"

      - name: Install backend dependencies
        working-directory: madrasati/madrasati/backend
        run: npm ci

      - name: Run backend tests
        working-directory: madrasati/madrasati/backend
        run: npm test || echo "No tests configured yet"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        working-directory: madrasati/madrasati/face
        run: |
          pip install -r requirements-fused.txt

      - name: Lint Python code
        working-directory: madrasati/madrasati/face
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

  # ===========================================================================
  # Job 2: Build Docker Images
  # ===========================================================================
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./madrasati/madrasati
          file: ./madrasati/docker-setup/Dockerfile.backend
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
          cache-to: type=inline

      - name: Build and push face-fused image
        uses: docker/build-push-action@v5
        with:
          context: ./madrasati
          file: ./madrasati/docker-setup/Dockerfile.face-fused
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-face-fused:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-face-fused:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-face-fused:latest
          cache-to: type=inline

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./madrasati/docker-setup/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-to: type=inline

  # ===========================================================================
  # Job 3: Deploy to Production Server
  # ===========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    environment:
      name: production
      url: http://${{ secrets.SERVER_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: |
            madrasati/docker-setup/docker-compose.base.yml
            madrasati/docker-setup/docker-compose.prod.new.yml
            madrasati/docker-setup/init-mongo.js
            madrasati/docker-setup/Dockerfile.*
          target: /opt/madrasati
          strip_components: 0
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            echo "🚀 Starting deployment..."
            cd /opt/madrasati/madrasati/docker-setup

            # Create volumes if they don't exist
            docker volume create madrasati_mongodb_data || true
            docker volume create madrasati_face_encodings || true
            docker volume create madrasati_backend_uploads || true
            docker volume create madrasati_face_unknown || true
            docker volume create madrasati_backend_logs || true
            docker volume create madrasati_face_logs || true
            docker volume create madrasati_face_dataset || true

            # Backup database before deployment
            echo "📦 Creating database backup..."
            docker exec madrasati_mongodb mongodump --out=/data/db/backup-$(date +%Y%m%d-%H%M%S) --authenticationDatabase=admin -u admin -p ${{ secrets.MONGO_PASSWORD }} || echo "No existing database to backup"

            # Pull latest images
            echo "🔽 Pulling latest images..."
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-face-fused:latest
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest

            # Deploy with docker-compose
            echo "🐳 Starting containers..."
            docker-compose -f docker-compose.base.yml -f docker-compose.prod.new.yml up -d --remove-orphans

            # Wait for services to be healthy
            echo "⏳ Waiting for services to be healthy..."
            sleep 10

            # Check service health
            echo "🏥 Checking service health..."
            docker-compose -f docker-compose.base.yml -f docker-compose.prod.new.yml ps

            # Clean up old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f --filter "until=72h"

            echo "✅ Deployment completed successfully!"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Wait a bit for services to stabilize
            sleep 15

            # Check if all containers are running
            cd /opt/madrasati/madrasati/docker-setup
            CONTAINERS=$(docker-compose -f docker-compose.base.yml -f docker-compose.prod.new.yml ps -q)

            for container in $CONTAINERS; do
              STATUS=$(docker inspect -f '{{.State.Status}}' $container)
              if [ "$STATUS" != "running" ]; then
                echo "❌ Container $container is not running!"
                exit 1
              fi
            done

            echo "✅ All containers are running!"

  # ===========================================================================
  # Job 4: Notification
  # ===========================================================================
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: Send success notification
        if: success()
        run: |
          echo "✅ Deployment successful!"
          # Add Slack/Discord/Email notification here

      - name: Send failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          # Add Slack/Discord/Email notification here
