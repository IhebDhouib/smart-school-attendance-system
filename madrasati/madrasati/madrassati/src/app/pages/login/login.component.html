<div class="login-page">
  <!-- Background Decorative Elements -->
  <div class="login-bg-shapes">
    <div class="login-shape login-shape-1"></div>
    <div class="login-shape login-shape-2"></div>
    <div class="login-shape login-shape-3"></div>
  </div>

  <!-- Login Container -->
  <div class="login-container">
    <!-- Logo & School Info -->
    <div class="login-header">
      <div class="login-logo">
        <i class="fas fa-graduation-cap"></i>
      </div>
      <h1 class="login-title">مدرستي</h1>
      <p class="login-subtitle">نظام إدارة الحضور الذكي</p>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <div class="login-card-header">
        <h2>تسجيل الدخول</h2>
        <p>مرحباً بك! الرجاء إدخال بياناتك</p>
      </div>

      <form (ngSubmit)="onLogin()" class="login-form">
        <!-- Email Input -->
        <div class="login-input-group">
          <label class="login-label">
            <i class="fas fa-envelope"></i>
            البريد الإلكتروني
          </label>
          <div class="login-input-wrapper">
            <input 
              type="email" 
              [(ngModel)]="email" 
              name="email" 
              required 
              placeholder="example@school.com"
              class="login-input"
              [disabled]="isLoading"
            />
          </div>
        </div>

        <!-- Password Input -->
        <div class="login-input-group">
          <label class="login-label">
            <i class="fas fa-lock"></i>
            كلمة المرور
          </label>
          <div class="login-input-wrapper">
            <input 
              type="password" 
              [(ngModel)]="password" 
              name="password" 
              required 
              placeholder="••••••••"
              class="login-input"
              [disabled]="isLoading"
            />
          </div>
        </div>

        <!-- Error Message -->
        <div *ngIf="error" class="login-error">
          <i class="fas fa-exclamation-circle"></i>
          <span>{{ error }}</span>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="login-btn"
          [class.login-btn-loading]="isLoading"
          [disabled]="isLoading"
        >
          <span *ngIf="!isLoading">
            <i class="fas fa-sign-in-alt"></i>
            تسجيل الدخول
          </span>
          <span *ngIf="isLoading" class="login-spinner">
            <i class="fas fa-spinner fa-spin"></i>
            جاري التحميل...
          </span>
        </button>
      </form>

      <!-- Footer Info -->
      <div class="login-footer">
        <p>
          <i class="fas fa-shield-alt"></i>
          تسجيل دخول آمن ومشفر
        </p>
      </div>
    </div>

    <!-- Copyright -->
    <div class="login-copyright">
      <p>© 2025 نظام مدرستي. جميع الحقوق محفوظة</p>
    </div>
  </div>
</div>
