<div class="container">
    <!-- Form Section -->
    <div>
        <h2>{{ isEditing ? 'تعديل المعلم' : 'إضافة معلم' }}</h2>

        <div *ngIf="errorMessage" class="error-message">
            {{ errorMessage }}
        </div>

        <form #teacherForm="ngForm" (ngSubmit)="saveTeacher(teacherForm)">
            <div>
                <label for="userId">رقم الهوية</label>
                <input id="userId" name="userId" [(ngModel)]="selectedTeacher.userId" [disabled]="isEditing" required />
            </div>

            <div>
                <label for="firstName">الاسم الأول</label>
                <input id="firstName" name="firstName" [(ngModel)]="selectedTeacher.firstName" required />
            </div>

            <div>
                <label for="lastName">الاسم الأخير</label>
                <input id="lastName" name="lastName" [(ngModel)]="selectedTeacher.lastName" required />
            </div>

            <div>
                <label for="subject">المادة</label>
                <input id="subject" name="subject" [(ngModel)]="selectedTeacher.subject" required />
            </div>

            <div>
                <label for="photo">صورة (اختياري)</label>
                <input id="photo" name="photo" type="file" #fileInput (change)="onFileSelected($event)"
                    accept="image/*" />
            </div>

            <div style="display: flex; gap: 1rem;">
                <button type="submit" [disabled]="!teacherForm.valid">
                    {{ isEditing ? 'تحديث' : 'إضافة' }}
                </button>
                <button type="button" (click)="resetForm()">إلغاء</button>
            </div>
        </form>
    </div>

    <!-- Table Section -->
    <div class="table-section" style="margin-top: 2rem;">
        <h2>قائمة المعلمين</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>رقم الهوية</th>
                        <th>الاسم الأول</th>
                        <th>الاسم الأخير</th>
                        <th>المادة</th>
                        <th>Photo</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let teacher of teachers">
                        <td>{{ teacher.userId }}</td>
                        <td>{{ teacher.firstName }}</td>
                        <td>{{ teacher.lastName }}</td>
                        <td>{{ teacher.subject }}</td>
                        <td>
                            <img *ngIf="teacher.photo" [src]="getImageUrl(teacher.photo)" alt="Photo" width="60" />
                        </td>
                        <td>
                            <button class="modifier" (click)="selectTeacher(teacher)">
                                تعديل
                            </button>
                            <button class="supprimer" (click)="deleteTeacher(teacher.userId)">
                                حذف
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
