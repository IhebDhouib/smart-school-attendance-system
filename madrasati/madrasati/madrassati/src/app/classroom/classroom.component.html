<div class="sidebar-adaptive-container">
  <div class="classroom-container">
    <!-- Header Section -->
    <div class="professional-header">
      <h1><i class="fas fa-chalkboard-teacher"></i> إدارة الفصول الدراسية</h1>
      <p>تنظيم وإدارة الفصول والمراحل التعليمية</p>
    </div>

    <div class="main-content">

      <div class="classroom-box">
    <h2>إضافة فصل دراسي</h2>
    <form (submit)="addClassroom(); $event.preventDefault()">
      <label>اسم الفصل :</label>
      <input [(ngModel)]="newClassroom.name" name="name" required />

      <label>المستوى :</label>
      <select [(ngModel)]="newClassroom.grade" name="grade" required>
        <option *ngFor="let grade of grades" [value]="grade">{{ grade }}</option>
      </select>

      <button type="submit">إضافة</button>
    </form>

    <h2>قائمة الفصول الدراسية</h2>
    <ul>
      <li *ngFor="let classroom of classrooms">
        {{ classroom.grade }} - {{ classroom.name }}
        <button (click)="deleteClassroom(classroom._id)">حذف</button>
      </li>
    </ul>
  </div>
    </div>
  </div>
</div>
