services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: madrasati_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-madrasati123}
      MONGO_INITDB_DATABASE: madrasati
    volumes:
      - ./data/mongodb:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    ports:
      - "27017:27017"
    networks:
      - madrasati_network

  # MongoDB Web Interface
  mongo-express:
    image: mongo-express:1.0.0
    container_name: madrasati_mongo_express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-madrasati123}
      ME_CONFIG_MONGODB_URL: mongodb://admin:${MONGO_PASSWORD:-madrasati123}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ""
      ME_CONFIG_BASICAUTH_PASSWORD: ""
      ME_CONFIG_MONGODB_ENABLE_ADMIN: true
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - madrasati_network

  # Node.js Backend
  backend:
    build:
      context: ../madrasati
      dockerfile: ../docker-setup/Dockerfile.backend
    container_name: madrasati_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      WEBSOCKET_PORT: 3001
      MONGODB_URI: mongodb://madrasati_user:${MONGO_PASSWORD:-madrasati123}@mongodb:27017/madrasati?authSource=madrasati
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      # Face API URL for forwarding student photos
      FACE_API_URL: http://face-fused:8000
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      - mongodb
    networks:
      - madrasati_network

  face-fused:
    build:
      context: ../
      dockerfile: docker-setup/Dockerfile.face-fused
    container_name: madrasati_face_fused
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: 1
      # Backend connection
      BACKEND_URL: http://backend:3000
      WEBSOCKET_URL: ws://backend:3001
      # InsightFace configuration (RetinaFace + ArcFace)
      INSIGHTFACE_MODEL: buffalo_l
      USE_GPU: "False"
      DET_SIZE: 640
      DET_THRESH: 0.5
      REC_THRESH: 0.45
      # Paths
      DATASET_DIR: /app/madrasati/face/dataset
      ENCODINGS_FILE_ARCFACE: /app/madrasati/face/encodings_arcface.pkl
      UNKNOWN_FACES_DIR: /app/madrasati/face/unknown_faces
      LOG_DIR: /app/madrasati/face/logs
    volumes:
      # Mount the face directory for live code editing (no rebuild needed)
      - ../madrasati/face:/app/madrasati/face
      # Mount docker-setup for unknown_faces_api
      - ./unknown_faces_api_fastapi.py:/app/docker-setup/unknown_faces_api_fastapi.py
      # Persistent storage for encodings and unknown faces
      - face_encodings:/app/madrasati/face/encodings
      - face_unknown:/app/madrasati/face/unknown_faces
      - face_logs:/app/madrasati/face/logs
      # Optional: Mount dataset if you want to manage it from host
      # - ./dataset:/app/madrasati/face/dataset
    ports:
      - "8000:8000"  # Face Encoding API
      - "5001:5001"  # Unknown Faces API
    depends_on:
      - backend
    networks:
      - madrasati_network
    privileged: true
    devices:
      - /dev/video0:/dev/video0
  # Angular Frontend
  frontend:
    build:
      context: ../../ 
      dockerfile: madrasati/docker-setup/Dockerfile.frontend
    container_name: madrasati_frontend
    restart: unless-stopped
    ports:
      - "80:80"

    depends_on:
      - backend
    networks:
      - madrasati_network

volumes:
  mongodb_data:
    driver: local
  face_encodings:
    driver: local
  face_unknown:
    driver: local
  face_logs:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local


networks:
  madrasati_network:
    driver: bridge
