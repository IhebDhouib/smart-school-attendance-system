services:
  face-fused:
    build:
      context: ../
      dockerfile: docker-setup/Dockerfile.face-fused
    container_name: madrasati_face_fused_dev
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: 1
      BACKEND_URL: http://localhost:3000
      WEBSOCKET_URL: ws://localhost:3001

    # Mount source code for live reloading during development
    volumes:
      # Mount the face service code
      - ../madrasati/face:/app/face:ro
      # Mount the main application file
      - ./app_with_env.py:/app/app_with_env.py:ro
      # Mount sync script
      - ./sync_encodings_with_db.py:/app/sync_encodings_with_db.py:ro
      # Mount FastAPI unknown faces API
      - ./unknown_faces_api_fastapi.py:/app/unknown_faces_api_fastapi.py:ro
      # Mount data directories (read-write)
      - face_encodings:/app/encodings
      - face_unknown:/app/unknown_faces
      - face_logs:/app/logs
      # Mount dataset directory for encoding generation
      - ../madrasati/face/dataset:/app/dataset

    ports:
      - "8000:8000"
      - "5001:5001"
    # Removed dependency on backend for standalone development
    networks:
      - madrasati_network
    privileged: true
    devices:
      - /dev/video0:/dev/video0

networks:
  madrasati_network:
    driver: bridge

volumes:
  face_encodings:
  face_unknown:
  face_logs:
