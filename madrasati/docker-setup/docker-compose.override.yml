# Docker Compose override for development
# This file is automatically loaded by docker-compose
# Use for development-specific configurations

version: '3.8'

services:
  backend:
    environment:
      NODE_ENV: development
    volumes:
      # Mount source code for hot reload in development
      - ../madrasati/madrasati/madrasati/backend:/app:ro
    ports:
      # Expose additional ports for debugging
      - "9229:9229"  # Node.js debugger

  face-api:
    environment:
      PYTHONUNBUFFERED: 1
      FASTAPI_ENV: development
    volumes:
      # Mount source code for development
      - ../madrasati/madrasati/madrasati/face:/app:ro
    command: ["uvicorn", "face_api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  face-detection:
    environment:
      PYTHONUNBUFFERED: 1
      PYTHON_ENV: development
    volumes:
      # Mount source code for development
      - ../madrasati/madrasati/madrasati/face:/app:ro

  frontend:
    # For development, you might want to run Angular dev server instead
    # Uncomment and modify as needed
    # command: ["ng", "serve", "--host", "0.0.0.0", "--port", "4200"]
    # ports:
    #   - "4200:4200"

